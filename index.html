<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation</title>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    img {
      width: 100%;
      max-width: 420px;
      opacity: 1;
      transition: opacity 1s ease;
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>

<body>

<img id="screen" src="loading.png">

<script>
  const img = document.getElementById("screen");

  // Preload final image
  const finalImage = new Image();
  finalImage.src = "finalpg.png";

  setTimeout(() => {
    // Step 1: Fade out loading image
    img.classList.add("fade-out");

    setTimeout(() => {
      // Step 2: Switch image while still invisible
      img.src = finalImage.src;

      // Step 3: Ensure it's still hidden
      img.style.opacity = 0;

      // Step 4: Trigger fade-in
      setTimeout(() => {
        img.style.opacity = 1;
      }, 50);

    }, 1000);

  }, 2500);
</script>

</body>
</html>
